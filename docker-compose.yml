services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: qru
      POSTGRES_USER: qru
      POSTGRES_PASSWORD: qru
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qru -d qru"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - qru_pg:/var/lib/postgresql/data
  api:
    image: python:3.12-slim
    working_dir: /workspace/backend
    volumes:
      - .:/workspace
    environment:
      QRU_DATABASE_URL: postgresql://qru:qru@db:5432/qru
      QRU_JWT_SECRET: DEV_ONLY_CHANGE_ME
      QRU_ENV: development
      QRU_RELEASE_SIGNING_SECRET: LEGACY_DEV_ONLY
      QRU_RELEASE_PUBLIC_KEY_B64: ${QRU_RELEASE_PUBLIC_KEY_B64:-}
    command: sh -c "pip install -r requirements.txt && python migrate.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  qru_pg:
