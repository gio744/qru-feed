name: QRU Backend PostgreSQL
on:
  workflow_dispatch:
  push:
    paths: ['backend/**', 'database/**', 'docker-compose.test.yml', '.github/workflows/backend-ci.yml']
  pull_request:
    paths: ['backend/**', 'database/**', 'docker-compose.test.yml', '.github/workflows/backend-ci.yml']
permissions:
  contents: read
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run PostgreSQL-backed suite
        run: docker compose -f docker-compose.test.yml up --abort-on-container-exit --exit-code-from tests
      - name: Save test and database logs
        if: always()
        run: docker compose -f docker-compose.test.yml logs --no-color > postgres-test.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qru-postgres-test-log
          path: postgres-test.log
          retention-days: 14
      - name: Stop disposable database
        if: always()
        run: docker compose -f docker-compose.test.yml down --volumes
