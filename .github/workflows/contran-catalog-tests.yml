name: CONTRAN Catalog Tests
on:
  push:
    branches: ['dev/qru-homologacao-isolada-20261116']
    paths:
      - 'scripts/import_contran_catalog.py'
      - 'scripts/test_import_contran_catalog.py'
      - '.github/workflows/contran-catalog-tests.yml'
  pull_request:
    paths:
      - 'scripts/import_contran_catalog.py'
      - 'scripts/test_import_contran_catalog.py'
permissions:
  contents: read
jobs:
  importer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4==4.13.4
      - run: python -m unittest discover -s scripts -p test_import_contran_catalog.py -v
