name: QRU Android Build
on:
  workflow_dispatch:
  push:
    paths: ['android/**','docs/drafts/**','scripts/validate_operational_drafts.py','scripts/test_validate_operational_drafts.py','scripts/verify_apk_norms.py','scripts/test_verify_apk_norms.py','.github/workflows/android-build.yml']
  pull_request:
    paths: ['android/**','docs/drafts/**','scripts/validate_operational_drafts.py','scripts/test_validate_operational_drafts.py','scripts/verify_apk_norms.py','scripts/test_verify_apk_norms.py']
jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    env:
      ANDROID_COMPILE_SDK: "35"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Environment report
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed
          test -f android/settings.gradle.kts
          test -f android/app/build.gradle.kts
          test -f android/app/src/main/AndroidManifest.xml

      # Preserve only checksum-verified official PDFs between workflow runs.
      # A new official publication still requires an exact SHA-256 match in Gradle.
      - name: Restore verified official PDF cache
        uses: actions/cache@v4
        with:
          path: android/app/build/generated/normAssets/norms
          key: qru-official-pdfs-${{ runner.os }}-${{ hashFiles('android/app/src/main/assets/norms/pdf-catalog.json') }}
          restore-keys: |
            qru-official-pdfs-${{ runner.os }}-

      - name: Verify unpublished editorial drafts remain blocked
        run: |
          python scripts/validate_operational_drafts.py
          python -m unittest discover -s scripts -p 'test_validate_operational_drafts.py' -v

      - name: Test APK and registration integrity checks before compilation
        run: |
          python -m unittest discover -s scripts -p 'test_verify_apk_norms.py' -v
          python -m unittest discover -s scripts -p 'test_register_apk.py' -v

      - name: Recover validated CONTRAN catalog for isolated build
        if: github.ref == 'refs/heads/dev/qru-homologacao-isolada-20261116'
        uses: actions/download-artifact@v4
        with:
          name: contran-catalog-validated
          run-id: 45606775871
          github-token: ${{ github.token }}
          path: catalog-staging

      - name: Validate and stage CONTRAN catalog
        if: github.ref == 'refs/heads/dev/qru-homologacao-isolada-20261116'
        run: |
          python -c "import json; r=json.load(open('catalog-staging/catalog.json'))['records']; assert len(r)==1035; assert all(x['status']=='pending_review' for x in r)"
          cp catalog-staging/catalog.json android/app/src/main/assets/norms/contran-catalog.json

      - name: Compile and unit test
        working-directory: android
        run: gradle -PqruParallelTest testDebugUnitTest assembleDebug --stacktrace --warning-mode all

      - name: Verify offline documents inside compiled APK
        run: python scripts/verify_apk_norms.py android/app/build/outputs/apk/debug/app-debug.apk android/app/src/main/assets/norms/pdf-catalog.json android/app/src/main/assets/norms/reference-page-ranges.json

      - name: Verify expanded catalog packaged intact
        if: github.ref == 'refs/heads/dev/qru-homologacao-isolada-20261116'
        run: |
          python -c "import zipfile,pathlib; z=zipfile.ZipFile('android/app/build/outputs/apk/debug/app-debug.apk'); assert z.read('assets/norms/contran-catalog.json')==pathlib.Path('catalog-staging/catalog.json').read_bytes()"

      - name: Verify isolated homologation APK identity
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          aapt="${ANDROID_HOME}/build-tools/35.0.0/aapt"
          test -x "$aapt"
          apksigner="${ANDROID_HOME}/build-tools/35.0.0/apksigner"
          test -x "$apksigner"
          "$apksigner" verify --verbose "$apk"
          # A valid signature alone does not establish which test key signed the APK.
          # Compare the actual signer certificate with the dedicated homologation key.
          expected_cert="$(keytool -exportcert -rfc -alias androiddebugkey -keystore android/test-signing/qru-debug.jks -storepass android 2>/dev/null | openssl x509 -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          actual_cert="$("$apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          test -n "$expected_cert"
          test -n "$actual_cert"
          if [ "$expected_cert" != "$actual_cert" ]; then
            echo "APK was not signed with the isolated homologation certificate" >&2
            exit 1
          fi
          badging="$("$aapt" dump badging "$apk")"
          printf '%s\n' "$badging" | grep -E "^package: name='br[.]com[.]qru[.]transito[.]homologacao20261114' versionCode='2' versionName='0[.]2[.]7-indice'([[:space:]]|$)"
          printf '%s\n' "$badging" | grep -F "application-label:'QRU Trânsito TESTE'"
          if printf '%s\n' "$badging" | grep -F "package: name='br.com.qru.transito' "; then
            echo "Refusing to upload a production-package APK as a homologation build" >&2
            exit 1
          fi

      - name: Verify and register APK
        run: |
          python scripts/register_apk.py android/app/build/outputs/apk/debug/app-debug.apk
 
      - name: Capture diagnostics on failure
        if: failure()
        run: |
          mkdir -p build-diagnostics
          find android -type f \( -name "*.log" -o -name "*.txt" -o -name "*.html" \) -path "*build*" -print -exec cp --parents {} build-diagnostics/ \; || true
          find android -maxdepth 5 -type f | sort > build-diagnostics/project-files.txt
          find ~/.gradle/daemon -type f -name "*.out.log" -print -exec cat {} \; > build-diagnostics/gradle-daemon.log 2>/dev/null || true
          python scripts/classify_build_failure.py < build-diagnostics/gradle-daemon.log > build-diagnostics/failure-classification.json || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: qru-build-diagnostics
          path: build-diagnostics/
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: qru-transito-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
            android/app/build/outputs/apk/debug/app-debug.apk.record.json
          if-no-files-found: error
