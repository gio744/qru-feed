name: QRU Android Build

on:
  workflow_dispatch:
  push:
    paths: ['android/**', '.github/workflows/android-build.yml']
  pull_request:
    paths: ['android/**']

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile and unit test
        working-directory: android
        run: gradle testDebugUnitTest assembleDebug --stacktrace --warning-mode all

      - name: Verify and register APK
        run: |
          python scripts/register_apk.py android/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: qru-transito-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
            android/app/build/outputs/apk/debug/app-debug.apk.record.json
          if-no-files-found: error
