name: QRU Android Build
on:
  workflow_dispatch:
  push:
    paths: ['android/**','docs/drafts/**','scripts/validate_operational_drafts.py','scripts/test_validate_operational_drafts.py','scripts/audit_reference_ranges.py','scripts/validate_operational_cards.py','content/operational-cards/**','docs/OPERACIONAL-FICHA-SCHEMA-v1.json','.github/workflows/android-build.yml']
  pull_request:
    paths: ['android/**','docs/drafts/**','scripts/validate_operational_drafts.py','scripts/test_validate_operational_drafts.py','scripts/audit_reference_ranges.py','scripts/validate_operational_cards.py','content/operational-cards/**','docs/OPERACIONAL-FICHA-SCHEMA-v1.json']
jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      ANDROID_COMPILE_SDK: "35"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Environment report
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed
          test -f android/settings.gradle.kts
          test -f android/app/build.gradle.kts
          test -f android/app/src/main/AndroidManifest.xml

      # Preserve only checksum-verified official PDFs between workflow runs.
      # A new official publication still requires an exact SHA-256 match in Gradle.
      - name: Restore verified official PDF cache
        uses: actions/cache@v4
        with:
          path: android/app/build/generated/normAssets/norms
          key: qru-official-pdfs-${{ runner.os }}-${{ hashFiles('android/app/src/main/assets/norms/pdf-catalog.json') }}
          restore-keys: |
            qru-official-pdfs-${{ runner.os }}-

      - name: Verify unpublished editorial drafts remain blocked
        run: |
          python scripts/validate_operational_drafts.py
          python -m unittest discover -s scripts -p 'test_validate_operational_drafts.py' -v

      - name: Compile and unit test
        working-directory: android
        run: gradle -PqruParallelTest testDebugUnitTest assembleDebug --stacktrace --warning-mode all

      - name: Verify and register APK
        run: |
          python scripts/register_apk.py android/app/build/outputs/apk/debug/app-debug.apk

      - name: Capture diagnostics on failure
        if: failure()
        run: |
          mkdir -p build-diagnostics
          find android -type f \( -name "*.log" -o -name "*.txt" -o -name "*.html" \) -path "*build*" -print -exec cp --parents {} build-diagnostics/ \; || true
          find android -maxdepth 5 -type f | sort > build-diagnostics/project-files.txt
          find ~/.gradle/daemon -type f -name "*.out.log" -print -exec cat {} \; > build-diagnostics/gradle-daemon.log 2>/dev/null || true
          python scripts/classify_build_failure.py < build-diagnostics/gradle-daemon.log > build-diagnostics/failure-classification.json || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: qru-build-diagnostics
          path: build-diagnostics/
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: qru-transito-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
            android/app/build/outputs/apk/debug/app-debug.apk.record.json
          if-no-files-found: error
