name: Content publication gates

on:
  pull_request:
    paths:
      - backend/app/releases.py
      - backend/app/release_readiness.py
      - backend/app/dossier.py
      - backend/tests/test_release_readiness_gate.py
      - backend/requirements.txt
      - .github/workflows/content-publication.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest tests/test_release_readiness_gate.py -q
