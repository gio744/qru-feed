name: QRU Android UI
on:
  push:
    branches:
      - feature/operational-accordion-distinctive
    paths:
      - 'android/**'
      - '.github/workflows/android-ui.yml'
      - 'scripts/run_android_ui_tests.sh'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-ui.yml'
      - 'scripts/run_android_ui_tests.sh'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-ui-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  interaction-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install compilation SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android interaction tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -memory 3072
          script: bash scripts/run_android_ui_tests.sh
      - name: Upload interaction reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ui-reports
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            android-ui-logcat.txt
          if-no-files-found: warn
