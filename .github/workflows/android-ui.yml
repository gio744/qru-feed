name: QRU Android UI
on:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-ui.yml'
      - 'scripts/run_android_ui_tests.sh'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: android-ui-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  interaction-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install compilation SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      # Reuse the same SHA-256-pinned PDFs as the successful APK build.
      # The Gradle task still verifies every cached file before using it.
      - name: Restore verified official PDF cache
        uses: actions/cache/restore@v4
        with:
          path: android/app/build/generated/normAssets/norms
          key: qru-norms-sha256-${{ hashFiles('android/app/src/main/assets/norms/pdf-catalog.json') }}
          restore-keys: |
            qru-norms-sha256-
      - name: Restore PDFs from last successful APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id=$(gh run list --repo "${{ github.repository }}" --workflow android-build.yml --status success --limit 15 --json databaseId --jq '.[0].databaseId')
          if [ -n "$run_id" ]; then
            mkdir -p /tmp/qru-previous-apk android/app/build/generated/normAssets/norms
            if gh run download "$run_id" --repo "${{ github.repository }}" --name qru-transito-debug-apk --dir /tmp/qru-previous-apk; then
              python3 scripts/restore_verified_pdfs_from_apk.py /tmp/qru-previous-apk/app-debug.apk android/app/build/generated/normAssets/norms
            fi
          fi
      - name: Restore verified CONTRAN staging PDFs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id=$(gh run list --repo "${{ github.repository }}" --workflow contran-pdf-staging.yml --status success --limit 20 --json databaseId --jq '.[0].databaseId')
          test -n "$run_id"
          mkdir -p /tmp/qru-contran-stage
          if gh run download "$run_id" --repo "${{ github.repository }}" --name contran-pdfs-1026-1029-staging --dir /tmp/qru-contran-stage; then
            python3 scripts/restore_verified_contran_pdfs.py /tmp/qru-contran-stage android/app/build/generated/normAssets/norms
          else
            echo "::warning::Staging artifact unavailable; Gradle will still enforce pinned PDF hashes."
          fi
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android interaction tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -memory 3072
          script: bash scripts/run_android_ui_tests.sh
      - name: Upload interaction reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ui-reports
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            android-ui-logcat.txt
          if-no-files-found: warn
