name: Testes da auditoria CONTRAN
on:
  pull_request:
    paths:
      - 'scripts/audit_pending_contran_pdfs.py'
      - 'scripts/test_audit_pending_contran_pdfs.py'
      - '.github/workflows/contran-audit-tests.yml'
      - 'android/app/src/main/assets/norms/pending-official-2026.json'
  push:
    paths:
      - 'scripts/audit_pending_contran_pdfs.py'
      - 'scripts/test_audit_pending_contran_pdfs.py'
      - '.github/workflows/contran-audit-tests.yml'
      - 'android/app/src/main/assets/norms/pending-official-2026.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Executar testes locais sem acesso à rede
        run: python3 -m unittest discover -s scripts -p 'test_audit_pending_contran_pdfs.py' -v
